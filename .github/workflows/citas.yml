name: Monitor de citas PNP

on:
  # La ejecucion programada se hace en Docker, desde una conexion residencial.
  # GitHub-hosted Actions sale desde IPs de datacenter y la PNP puede bloquearlas.
  workflow_dispatch:        # solo para diagnostico manual

permissions:
  contents: write           # necesario para hacer commit de web/estado.json

concurrency:
  group: monitor-citas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --quiet playwright requests
          playwright install --with-deps chromium

      - name: Revisar disponibilidad de citas
        env:
          PNP_DNI: ${{ secrets.PNP_DNI }}
          PNP_CLAVE: ${{ secrets.PNP_CLAVE }}
          PNP_TIPO_DOC: ${{ vars.PNP_TIPO_DOC || '1' }}
          SEDE: ${{ vars.SEDE || '1' }}
          FECHA_OBJETIVO: ${{ vars.FECHA_OBJETIVO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python checker.py

      - name: Publicar el estado
        run: |
          git config user.name  "monitor-citas"
          git config user.email "actions@users.noreply.github.com"
          git add web/estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado."
          else
            git commit -m "estado: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
